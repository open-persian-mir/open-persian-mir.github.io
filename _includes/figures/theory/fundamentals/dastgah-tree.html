{% assign fig = site.data.figures.theory.fundamentals.dastgahTree %}
<figure class="interactive-figure fc-tree-figure" id="{{ fig.id }}">
  <div class="fc-tree-root">Radif (ردیف) — 7 Dastgāhs & 5 Āvāzes</div>

  <div class="fc-tree-branches" role="tablist" aria-label="Seven Dastgāhs">
    {% for d in fig.dastgahs %}
      <button
        type="button"
        class="audio-btn fc-branch-btn{% if forloop.first %} active{% endif %}"
        data-dt-id="{{ d.id }}"
        role="tab"
        aria-selected="{% if forloop.first %}true{% else %}false{% endif %}"
      >
        {{ d.name }} <span class="fc-persian">({{ d.persian }})</span>
        {% if d.avazes.size > 0 %}
          <span class="fc-badge">+{{ d.avazes.size }} Āvāz</span>
        {% endif %}
      </button>
    {% endfor %}
  </div>

  <div class="fc-tree-panels">
    {% for d in fig.dastgahs %}
      <div class="fc-tree-panel{% unless forloop.first %} is-hidden{% endunless %}" data-dt-panel="{{ d.id }}">
        <div class="fc-panel-title">
          <strong>Dastgāh-e {{ d.name }}</strong> ({{ d.persian }}) · Mother Maqām: <em>{{ d.motherMaqam }}</em>
        </div>
        <p class="fc-panel-note">{{ d.note }}</p>
        {% if d.avazes.size > 0 %}
          <div class="fc-avaz-list">
            <span class="fc-avaz-heading">Derived Āvāzes:</span>
            {% for av in d.avazes %}
              <span class="fc-avaz-pill">{{ av }}</span>
            {% endfor %}
          </div>
        {% else %}
          <div class="fc-avaz-list"><em>No canonical derived Āvāzes.</em></div>
        {% endif %}
      </div>
    {% endfor %}
  </div>

  <figcaption>{{ fig.caption }}</figcaption>
</figure>
