{% assign fig = site.data.figures.theory.fundamentals.degreeHierarchy %}
<figure class="interactive-figure fc-dh-figure" id="{{ fig.id }}">
  <div class="figure-controls fc-dh-presets" role="group" aria-label="Modal hierarchy presets">
    {% for preset in fig.presets %}
      <button
        type="button"
        class="audio-btn{% if forloop.first %} active{% endif %}"
        data-dh-preset="{{ preset.id }}"
      >{{ preset.label }}</button>
    {% endfor %}
  </div>

  <div class="fc-dh-strip">
    {% for deg in fig.degrees %}
      <div class="fc-dh-pill" data-dh-deg="{{ forloop.index0 }}" data-hz="{{ deg.hz }}">
        <span class="fc-dh-num">{{ deg.num }}</span>
        <span class="fc-dh-label">{{ deg.label }}</span>
        <span class="fc-dh-role" data-dh-role></span>
      </div>
    {% endfor %}
  </div>

  <div class="figure-controls">
    <button type="button" class="audio-btn" id="dh-play-phrase">▶ Play Modal Phrase</button>
  </div>

  <div id="dh-readout" class="figure-readout"></div>
  <figcaption>{{ fig.caption }}</figcaption>
</figure>
