---
layout: default
---
<article>
  {% if page.title %}
    <h1>{{ page.title }}</h1>
  {% endif %}
  {% if page.summary %}
    <p class="summary">{{ page.summary }}</p>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
  {% if page.page_js %}
  <script src="{{ '/assets/js/' | append: page.page_js | append: '.js' | relative_url }}" defer></script>
  {% endif %}
</article>
